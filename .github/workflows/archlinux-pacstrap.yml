name: RootFS Archlinux (pacstrap)

# 与 archlinux.yml 的区别:
#   旧流程: 解压 ALARM 官方 rootfs → 卸包/装包/精简
#   本流程: ALARM tarball 仅作 bootstrap 工具链 → pacstrap 向空目录从零安装
#
# 产物文件名与 release tag 与旧流程一致, 可直接被 rebuild.yml 使用。

on:
  workflow_dispatch:
    inputs:
      arch_release:
        description: "Arch 版本标识（ALARM 目前无版本号，仅作文件名 tag）"
        required: false
        default: "aarch64"
        type: choice
        options:
          - aarch64

      root_password:
        description: "root 密码"
        required: false
        default: "1234"

      hostname:
        description: "主机名"
        required: false
        default: "archlinux"

      timezone:
        description: "时区"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Tokyo
          - America/New_York
          - Europe/London
          - UTC

      extra_packages:
        description: "额外 pacman 包（空格分隔，可选）"
        required: false
        default: ""

env:
  TZ: UTC
  ROOTFS_DIR: /builder/arch-rootfs
  BOOTSTRAP_DIR: /builder/arch-bootstrap

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 初始化环境 ──────────────────────────────────────────────────
      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile

          sudo -E apt-get -y update
          sudo -E apt-get -y purge \
            azure-cli ghc* zulu* llvm* firefox google* dotnet* \
            powershell openjdk* mongodb* moby* 2>/dev/null || true
          # bsdtar: 解压 ALARM bootstrap 保留 capability xattr
          sudo -E apt-get -y install \
            parted e2fsprogs dosfstools btrfs-progs \
            u-boot-tools uuid-runtime openssl pigz \
            git curl wget xz-utils lz4 zstd pv jq rsync \
            libarchive-tools
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ}"

          echo "ARCH_RELEASE=${{ inputs.arch_release || 'aarch64' }}" >> "${GITHUB_ENV}"
          echo "ROOT_PASSWORD=${{ inputs.root_password   || '1234' }}"  >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname         || 'archlinux' }}" >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone               || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"
          echo "EXTRA_PKGS=${{ inputs.extra_packages     || '' }}"        >> "${GITHUB_ENV}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 2. 合并磁盘空间 ───────────────────────────────────────────────
      - name: Create build disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}G"  /mnt/mnt.img
          sudo truncate -s "${root_size}G" /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6 /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          echo "可用空间: $(df -h /builder | tail -1 | awk '{print $4}')"

      # ── 3. pacstrap 从零构建 Arch rootfs ───────────────────────────────
      # ALARM tarball 只作为 bootstrap（提供 pacman / pacstrap），
      # 真正的 rootfs 由 pacstrap 装进空目录，不继承预装的内核/firmware。
      - name: Build Arch rootfs (pacstrap)
        id: build_rootfs
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail

          sudo mkdir -p "${BOOTSTRAP_DIR}" "${ROOTFS_DIR}"

          # ── chroot helper（bootstrap / 最终 rootfs 共用）──────────────
          # 不用 arch-chroot：它会 bind rootfs 到自身，导致 pacman cachedir 报错。
          mount_chroot() {
              local root="$1"
              sudo mkdir -p "${root}"/{proc,sys,dev,dev/pts,run}
              sudo mount -t proc     proc     "${root}/proc"
              sudo mount -t sysfs    sysfs    "${root}/sys"
              sudo mount --bind      /dev     "${root}/dev"
              sudo mount --bind      /dev/pts "${root}/dev/pts"
              sudo mount -t tmpfs    tmpfs    "${root}/run"
          }
          umount_chroot() {
              local root="$1"
              sudo umount -R "${root}/run"      2>/dev/null || true
              sudo umount -R "${root}/dev/pts"  2>/dev/null || true
              sudo umount -R "${root}/dev"      2>/dev/null || true
              sudo umount -R "${root}/sys"      2>/dev/null || true
              sudo umount -R "${root}/proc"     2>/dev/null || true
          }
          cleanup_all() {
              umount_chroot "${ROOTFS_DIR}"
              # bootstrap 上可能 bind 了 newroot
              sudo umount -R "${BOOTSTRAP_DIR}/mnt" 2>/dev/null || true
              umount_chroot "${BOOTSTRAP_DIR}"
          }
          trap cleanup_all EXIT

          # ── 下载 ALARM 官方 tarball（仅 bootstrap 工具链）────────────
          ALARM_MIRRORS=(
            "https://fl.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "https://mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
            "https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz"
          )

          downloaded=0
          for url in "${ALARM_MIRRORS[@]}"; do
            echo "▶ 尝试下载 bootstrap: ${url}"
            if wget -q --show-progress --tries=3 --timeout=30 -c -O /tmp/alarm-bootstrap.tar.gz "${url}"; then
              downloaded=1
              echo "▶ 下载成功: ${url}"
              break
            fi
            echo "::warning::下载失败: ${url}，尝试下一个镜像"
          done
          [[ "${downloaded}" -eq "1" ]] || { echo "::error::所有 ALARM 镜像均下载失败"; exit 1; }
          echo "▶ 大小: $(du -sh /tmp/alarm-bootstrap.tar.gz | awk '{print $1}')"

          command -v bsdtar || { echo "::error::bsdtar 不可用"; exit 1; }
          echo "▶ 解压 bootstrap → ${BOOTSTRAP_DIR} ..."
          sudo bsdtar -xpf /tmp/alarm-bootstrap.tar.gz -C "${BOOTSTRAP_DIR}"
          rm -f /tmp/alarm-bootstrap.tar.gz
          echo "▶ bootstrap 大小: $(sudo du -sh ${BOOTSTRAP_DIR} | awk '{print $1}')"

          # ── bootstrap DNS + 多镜像 pacman.conf ───────────────────────
          sudo tee "${BOOTSTRAP_DIR}/etc/resolv.conf" > /dev/null << 'RESOLV_EOF'
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          nameserver 1.1.1.1
          RESOLV_EOF
          sudo sed -i 's/^[[:space:]]*//' "${BOOTSTRAP_DIR}/etc/resolv.conf"

          sudo tee "${BOOTSTRAP_DIR}/etc/pacman.conf" > /dev/null << 'PACMAN_EOF'
          [options]
          Architecture = aarch64
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          HoldPkg = pacman glibc
          ParallelDownloads = 5

          [core]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [extra]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [alarm]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

          [aur]
          Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirror.archlinuxarm.org/$arch/$repo
          Server = https://de.mirror.archlinuxarm.org/$arch/$repo
          Server = https://fr.mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
          PACMAN_EOF
          sudo sed -i 's/^[[:space:]]*//' "${BOOTSTRAP_DIR}/etc/pacman.conf"

          # ── 初始化 bootstrap keyring，并确保有 pacstrap ─────────────
          echo "▶ 挂载 bootstrap chroot..."
          mount_chroot "${BOOTSTRAP_DIR}"

          echo "▶ 初始化 bootstrap pacman keyring..."
          sudo chroot "${BOOTSTRAP_DIR}" /bin/bash -c "
            set -e
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Sy --noconfirm
            # pacstrap 来自 arch-install-scripts
            pacman -S --noconfirm --needed arch-install-scripts
          "

          # ── pacstrap：向空 ROOTFS_DIR 从零安装 ───────────────────────
          # 把目标 root 绑到 bootstrap/mnt，在 chroot 内执行 pacstrap
          sudo mkdir -p "${BOOTSTRAP_DIR}/mnt"
          sudo mount --bind "${ROOTFS_DIR}" "${BOOTSTRAP_DIR}/mnt"

          # 包列表：不装内核/firmware（盒子内核由 rebuild 阶段的 deb 提供）
          PACSTRAP_PKGS="base openssh sudo curl wget ca-certificates tzdata \
            iproute2 binutils bluez-utils bluez \
            net-tools iputils bind \
            wireless_tools wpa_supplicant wireless-regdb \
            bash-completion htop nano nftables bc \
            uboot-tools parted networkmanager \
            btrfs-progs e2fsprogs dosfstools \
            lsof file procps-ng cronie \
            rsync logrotate perl"

          echo "▶ pacstrap → ${ROOTFS_DIR} ..."
          # -K: 在新 root 内初始化 keyring
          # -G: 不把 bootstrap 的 keyring 拷过去（我们用 -K 自己 init）
          sudo chroot "${BOOTSTRAP_DIR}" /bin/bash -c "
            set -e
            pacstrap -K /mnt ${PACSTRAP_PKGS}
          "

          if [[ -n "${EXTRA_PKGS}" ]]; then
            echo "▶ pacstrap 额外包: ${EXTRA_PKGS}"
            sudo chroot "${BOOTSTRAP_DIR}" /bin/bash -c "
              set -e
              pacstrap -K /mnt ${EXTRA_PKGS}
            "
          fi

          # 解绑 newroot，后续直接对 ROOTFS_DIR 操作
          sudo umount -R "${BOOTSTRAP_DIR}/mnt" 2>/dev/null || true
          umount_chroot "${BOOTSTRAP_DIR}"

          echo "▶ pacstrap 后 rootfs: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"

          # ── 卸掉可能被 base 拉进来的内核/firmware ───────────────────
          mount_chroot "${ROOTFS_DIR}"

          # 把同一套多镜像配置写进最终 rootfs（pacstrap 可能只拷了默认 mirrorlist）
          sudo cp "${BOOTSTRAP_DIR}/etc/pacman.conf" "${ROOTFS_DIR}/etc/pacman.conf"
          sudo tee "${ROOTFS_DIR}/etc/resolv.conf" > /dev/null << 'RESOLV_EOF'
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          nameserver 1.1.1.1
          RESOLV_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/resolv.conf"

          echo "▶ 清理可能存在的内核/firmware（本流程不内置）..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set +e
            # base 一般不带内核；若镜像侧把 linux-* 作为依赖拉进来则卸掉
            pacman -Rns --noconfirm \
              linux-aarch64 linux-firmware \
              linux-firmware-whence linux-firmware-intel linux-firmware-nvidia \
              linux-firmware-atheros linux-firmware-amdgpu linux-firmware-other \
              linux-firmware-mediatek linux-firmware-realtek linux-firmware-broadcom \
              linux-firmware-cirrus linux-firmware-radeon \
              mkinitcpio mkinitcpio-busybox \
              netctl dhcpcd \
              2>/dev/null || true
            orphans=\$(pacman -Qdtq 2>/dev/null || true)
            [[ -n \"\${orphans}\" ]] && pacman -Rns --noconfirm \${orphans} || true
            pacman -Syu --noconfirm --needed || true
          "

          echo "▶ 收尾清理..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            set -e
            pacman -Sc --noconfirm >/dev/null 2>&1 || true
            rm -rf /var/cache/pacman/pkg/*
            rm -f /var/log/pacman.log
            find /var/log -type f -exec truncate -s 0 {} \; 2>/dev/null || true
            rm -rf /var/log/journal/*
            rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/info/*
            rm -rf /usr/share/gtk-doc/* /usr/share/readline/*
            find /usr/share/locale -type f \
              ! -name 'en_US*' ! -name 'zh_CN*' ! -name 'zh_TW*' \
              ! -name 'locale.alias' \
              -delete 2>/dev/null || true
            find /usr/share/locale -type d -empty -delete 2>/dev/null || true
            rm -rf /root/.cache /root/.bash_history /tmp/* /var/tmp/*
            rm -rf /var/lib/pacman/sync/*
          "

          # ── 时区 / locale / hostname ──────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime
          sudo chroot "${ROOTFS_DIR}" bash -c "
            sed -i 's/^# *\(en_US.UTF-8\)/\1/' /etc/locale.gen || true
            # ALARM locale.gen 可能写法不同，强制打开 en_US
            grep -q '^en_US.UTF-8' /etc/locale.gen 2>/dev/null || echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
            locale-gen
            echo 'LANG=en_US.UTF-8' > /etc/locale.conf
          "

          echo "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hostname" > /dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' \
            "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hosts" > /dev/null

          # ── SSH ───────────────────────────────────────────────────────
          sudo mkdir -p -m 0755 "${ROOTFS_DIR}/run/sshd"
          if [[ -f "${ROOTFS_DIR}/etc/ssh/sshd_config" ]]; then
            sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/'             "${ROOTFS_DIR}/etc/ssh/sshd_config"
            sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "${ROOTFS_DIR}/etc/ssh/sshd_config"
          fi

          # ── root 密码 ─────────────────────────────────────────────────
          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"

          # ── systemd 超时 ──────────────────────────────────────────────
          SYS_CONF="${ROOTFS_DIR}/etc/systemd/system.conf"
          [[ -f "${SYS_CONF}" ]] && {
            sudo sed -i "s|^#*DefaultTimeoutStartSec.*|DefaultTimeoutStartSec=10s|g" "${SYS_CONF}"
            sudo sed -i "s|^#*DefaultTimeoutStopSec.*|DefaultTimeoutStopSec=10s|g"   "${SYS_CONF}"
          } || true

          # ── enable 基础服务 ───────────────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c "
            systemctl enable sshd                    2>/dev/null || systemctl enable ssh 2>/dev/null || true
            systemctl enable NetworkManager          2>/dev/null || true
            systemctl enable systemd-timesyncd       2>/dev/null || true
            systemctl enable nftables                2>/dev/null || true
            systemctl disable systemd-pstore.service 2>/dev/null || true
            systemctl disable systemd-networkd.service 2>/dev/null || true
          "

          # ── 面向用户的官方 GeoIP 镜像 ─────────────────────────────────
          sudo tee "${ROOTFS_DIR}/etc/pacman.conf" > /dev/null << 'PACMAN_USER_EOF'
          [options]
          Architecture = aarch64
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional
          HoldPkg = pacman glibc

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [alarm]
          Include = /etc/pacman.d/mirrorlist

          [aur]
          Include = /etc/pacman.d/mirrorlist
          PACMAN_USER_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/pacman.conf"

          sudo mkdir -p "${ROOTFS_DIR}/etc/pacman.d"
          printf 'Server = http://mirror.archlinuxarm.org/\$arch/\$repo\n' \
            | sudo tee "${ROOTFS_DIR}/etc/pacman.d/mirrorlist" > /dev/null

          # ── fstab ─────────────────────────────────────────────────────
          printf 'LABEL=ROOTFS\t/\text4\tdefaults,noatime,nodiratime,commit=600,errors=remount-ro\t0 1\n' \
            | sudo tee    "${ROOTFS_DIR}/etc/fstab" > /dev/null
          printf 'LABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n' \
            | sudo tee -a "${ROOTFS_DIR}/etc/fstab" > /dev/null

          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"

          # ── /etc/os-release（rebuild 读 ID / VERSION_CODENAME）────────
          sudo rm -f "${ROOTFS_DIR}/etc/os-release"
          sudo tee "${ROOTFS_DIR}/etc/os-release" > /dev/null << 'OSREL_EOF'
          NAME="Arch Linux ARM"
          ID=arch
          ID_LIKE=arch
          VERSION_CODENAME=rolling
          VERSION_ID=rolling
          PRETTY_NAME="Arch Linux ARM"
          ANSI_COLOR="38;2;23;147;209"
          HOME_URL="https://archlinuxarm.org/"
          DOCUMENTATION_URL="https://archlinuxarm.org/wiki"
          SUPPORT_URL="https://archlinuxarm.org/forum"
          BUG_REPORT_URL="https://github.com/archlinuxarm/PKGBUILDs/issues"
          OSREL_EOF
          sudo sed -i 's/^[[:space:]]*//' "${ROOTFS_DIR}/etc/os-release"
          sudo cp "${ROOTFS_DIR}/etc/os-release" "${ROOTFS_DIR}/usr/lib/os-release"

          umount_chroot "${ROOTFS_DIR}"
          trap - EXIT

          # bootstrap 已完成使命，释放空间
          echo "▶ 删除 bootstrap 工具链..."
          sudo rm -rf "${BOOTSTRAP_DIR}"

          echo "▶ rootfs 最终大小: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 4. 打包 rootfs tar.gz ────────────────────────────────────────
      - name: Package rootfs
        id: package_rootfs
        if: ${{ steps.build_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"

          TARBALL="Arch_${ARCH_RELEASE}_rootfs.tar.gz"
          echo "▶ 打包 → ${TARBALL} ..."
          sudo tar -czf "${OUT_DIR}/${TARBALL}" -C "${ROOTFS_DIR}" .
          echo "▶ 大小: $(du -sh ${OUT_DIR}/${TARBALL} | awk '{print $1}')"

          cd "${OUT_DIR}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

          BUILT_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "TARBALL=${TARBALL}"       >> "${GITHUB_OUTPUT}"
          echo "TARBALL_PATH=${OUT_DIR}/${TARBALL}" >> "${GITHUB_OUTPUT}"
          echo "SHA256_PATH=${OUT_DIR}/${TARBALL}.sha256" >> "${GITHUB_OUTPUT}"
          echo "OUT_DIR=${OUT_DIR}"       >> "${GITHUB_OUTPUT}"
          echo "BUILT_DATE=${BUILT_DATE}" >> "${GITHUB_OUTPUT}"
          echo "status=success"           >> "${GITHUB_OUTPUT}"

      # ── 5. 打包成 rebuild 可识别的 *.img.xz ──────────────────────────
      - name: Package rootfs into an image
        id: wrap_image
        if: ${{ steps.package_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/wrap"
          sudo rm -rf "${WORK}" && mkdir -p "${WORK}"

          used_mb=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          img_mb=$(( used_mb * 14 / 10 + 512 ))

          IMG_NAME="Arch_${ARCH_RELEASE}_arm64_rootfs.img"
          IMG_PATH="${WORK}/${IMG_NAME}"

          echo "▶ 创建空白镜像: ${img_mb}MiB"
          truncate -s "${img_mb}M" "${IMG_PATH}"

          parted -s "${IMG_PATH}" mklabel msdos
          parted -s "${IMG_PATH}" mkpart primary ext4 1MiB 100%

          LOOPDEV=$(sudo losetup -P -f --show "${IMG_PATH}")
          sudo mkfs.ext4 -F -L ROOTFS "${LOOPDEV}p1"

          MNT="${WORK}/mnt"
          mkdir -p "${MNT}"
          sudo mount "${LOOPDEV}p1" "${MNT}"

          echo "▶ 写入 rootfs 内容..."
          sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"

          grep -q '^ID=' "${MNT}/etc/os-release"
          grep -q '^VERSION_CODENAME=' "${MNT}/etc/os-release" || \
            echo "VERSION_CODENAME=rolling" | sudo tee -a "${MNT}/etc/os-release" > /dev/null

          sync
          sudo umount "${MNT}"
          sudo losetup -d "${LOOPDEV}"

          echo "▶ 压缩镜像 (xz)..."
          xz -T0 -9 -f "${IMG_PATH}"

          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"
          mv -f "${IMG_PATH}.xz" "${OUT_DIR}/"
          IMG_XZ_NAME="${IMG_NAME}.xz"

          cd "${OUT_DIR}"
          sha256sum "${IMG_XZ_NAME}" > "${IMG_XZ_NAME}.sha256"

          echo "IMG_XZ_NAME=${IMG_XZ_NAME}"           >> "${GITHUB_OUTPUT}"
          echo "IMG_XZ_PATH=${OUT_DIR}/${IMG_XZ_NAME}" >> "${GITHUB_OUTPUT}"
          echo "IMG_XZ_SHA256_PATH=${OUT_DIR}/${IMG_XZ_NAME}.sha256" >> "${GITHUB_OUTPUT}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 6. 发布到 Release (tag: rootfs) ──────────────────────────────
      - name: Release rootfs
        uses: ncipollo/release-action@main
        if: ${{ steps.package_rootfs.outputs.status == 'success' && !cancelled() }}
        with:
          tag: "rootfs"
          name: "rootfs"
          prerelease: true
          artifacts: |
            ${{ steps.wrap_image.outputs.IMG_XZ_PATH }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
