name: RootFS Void

# 官方 aarch64 ROOTFS tarball + xbps-install。Void 默认 runit。

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "root 密码"
        required: false
        default: "1234"
      hostname:
        description: "主机名"
        required: false
        default: "void"
      timezone:
        description: "时区"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - UTC

env:
  TZ: UTC
  ROOTFS_DIR: /builder/void-rootfs

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y install parted e2fsprogs dosfstools openssl pigz curl wget xz-utils zstd jq rsync
          sudo -E apt-get clean
          echo "ROOT_PASSWORD=${{ inputs.root_password || '1234' }}" >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname || 'void' }}" >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Create build disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//' ) - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//' ) - 4)
          sudo truncate -s "${mnt_size}G" /mnt/mnt.img
          sudo truncate -s "${root_size}G" /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6 /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 /dev/github/runner
          sudo mkdir -p /builder && sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder

      - name: Build Void rootfs
        id: build_rootfs
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          sudo mkdir -p "${ROOTFS_DIR}"
          mount_chroot() {
            local root="$1"
            sudo mkdir -p "${root}"/{proc,sys,dev,run}
            sudo mount -t proc proc "${root}/proc"
            sudo mount -t sysfs sysfs "${root}/sys"
            sudo mount --rbind /dev "${root}/dev"
            sudo mount --make-rslave "${root}/dev"
            sudo mount -t tmpfs tmpfs "${root}/run"
          }
          force_umount() {
            local root="$1"
            if command -v findmnt >/dev/null 2>&1; then
              while read -r tgt; do [[ -n "$tgt" ]] || continue; sudo umount -l "$tgt" 2>/dev/null || true
              done < <(findmnt -R -n -o TARGET --list "$root" 2>/dev/null | sort -r)
            fi
            for sub in run dev sys proc; do sudo umount -R -l "${root}/${sub}" 2>/dev/null || true; done
          }
          trap 'force_umount "${ROOTFS_DIR}"' EXIT
          MIRRORS=("https://repo-default.voidlinux.org/live/current" "https://repo-fastly.voidlinux.org/live/current")
          downloaded=0
          VOID_MIRROR="https://repo-default.voidlinux.org"
          for base in "${MIRRORS[@]}"; do
            HTML=$(curl -fsSL "${base}/" 2>/dev/null || true)
            FILE=$(echo "$HTML" | grep -oE "void-aarch64-ROOTFS-[0-9]+\.tar\.xz" | sort -u | tail -1)
            [[ -n "$FILE" ]] || continue
            if wget -q --tries=3 --timeout=60 -O /tmp/void-rootfs.tar.xz "${base}/${FILE}"; then
              downloaded=1
              VOID_MIRROR="${base%/live/current}"
              break
            fi
          done
          [[ "$downloaded" -eq 1 ]] || { echo "::error::下载 Void ROOTFS 失败"; exit 1; }
          sudo tar -xJf /tmp/void-rootfs.tar.xz -C "${ROOTFS_DIR}"
          rm -f /tmp/void-rootfs.tar.xz
          echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee "${ROOTFS_DIR}/etc/resolv.conf" > /dev/null
          sudo mkdir -p "${ROOTFS_DIR}/etc/xbps.d"
          echo "repository=${VOID_MIRROR}/current/aarch64" | sudo tee "${ROOTFS_DIR}/etc/xbps.d/00-repository-main.conf" > /dev/null
          mount_chroot "${ROOTFS_DIR}"
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c '
            set +e
            export XBPS_ARCH=aarch64
            # 必须先 -S 刷新索引，再单独升级 xbps；否则本地缓存显示 up to date，-Suy 仍退出 16
            xbps-install -S
            xbps-install -yu xbps
            hash -r
            xbps-install -Suy
            xbps-install -Suy
            set -e
            xbps-install -y \
              openssh sudo curl wget ca-certificates \
              chrony bc \
              iproute2 NetworkManager \
              net-tools iputils \
              iw wpa_supplicant \
              htop nano \
              parted e2fsprogs dosfstools rsync
            xbps-remove -Oy
            rm -rf /var/cache/xbps/*
          '
          sudo chroot "${ROOTFS_DIR}" ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime 2>/dev/null || true
          echo "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hostname" > /dev/null
          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"
          if [[ -f "${ROOTFS_DIR}/etc/ssh/sshd_config" ]]; then
            sudo sed -i "s/^#*PermitRootLogin.*/PermitRootLogin yes/" "${ROOTFS_DIR}/etc/ssh/sshd_config"
            sudo sed -i "s/^#*PasswordAuthentication.*/PasswordAuthentication yes/" "${ROOTFS_DIR}/etc/ssh/sshd_config"
          fi
          # 启用 runit 服务：/var/service 在 ROOTFS 中是指向 /run/runit/runsvdir/current 的 symlink，
          # chroot 内 /run 为空 tmpfs（悬空），mkdir/ln 都会失败；正确做法是链接到 default runsvdir，
          # 真机启动时 runit 会将 current 指向 default，服务自动拉起
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c 'mkdir -p /etc/runit/runsvdir/default; for s in sshd NetworkManager chronyd; do [[ -d /etc/sv/$s ]] && ln -sf /etc/sv/$s /etc/runit/runsvdir/default/$s; done'
          grep -q "^VERSION_CODENAME=" "${ROOTFS_DIR}/etc/os-release" 2>/dev/null || echo "VERSION_CODENAME=void" | sudo tee -a "${ROOTFS_DIR}/etc/os-release" > /dev/null
          printf "LABEL=ROOTFS\t/\text4\tdefaults,noatime\t0 1\nLABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n" | sudo tee "${ROOTFS_DIR}/etc/fstab" > /dev/null
          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"
          force_umount "${ROOTFS_DIR}"; trap - EXIT
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Package rootfs into an image
        id: wrap_image
        if: ${{ steps.build_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/wrap"; sudo rm -rf "${WORK}" && mkdir -p "${WORK}"
          used_mb=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          img_mb=$(( used_mb * 14 / 10 + 512 ))
          IMG_NAME="Void_aarch64_arm64_rootfs.img"
          IMG_PATH="${WORK}/${IMG_NAME}"
          truncate -s "${img_mb}M" "${IMG_PATH}"
          parted -s "${IMG_PATH}" mklabel msdos
          parted -s "${IMG_PATH}" mkpart primary ext4 1MiB 100%
          LOOPDEV=$(sudo losetup -P -f --show "${IMG_PATH}")
          sudo mkfs.ext4 -F -L ROOTFS "${LOOPDEV}p1"
          MNT="${WORK}/mnt"; mkdir -p "${MNT}"
          sudo mount "${LOOPDEV}p1" "${MNT}"
          sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
          grep -q "^VERSION_CODENAME=" "${MNT}/etc/os-release" || echo "VERSION_CODENAME=void" | sudo tee -a "${MNT}/etc/os-release" > /dev/null
          sync; sudo umount "${MNT}"; sudo losetup -d "${LOOPDEV}"
          xz -T0 -9 -f "${IMG_PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/output"; mkdir -p "${OUT_DIR}"
          mv -f "${IMG_PATH}.xz" "${OUT_DIR}/"
          echo "IMG_XZ_PATH=${OUT_DIR}/${IMG_NAME}.xz" >> "${GITHUB_OUTPUT}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Release rootfs
        uses: ncipollo/release-action@main
        if: ${{ steps.wrap_image.outputs.status == 'success' && !cancelled() }}
        with:
          tag: rootfs
          name: "rootfs"
          prerelease: true
          artifacts: |
            ${{ steps.wrap_image.outputs.IMG_XZ_PATH }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
