name: RootFS openSUSE

# skopeo 拉取官方 aarch64 容器镜像 → 解层 → chroot 内 zypper 装包

on:
  workflow_dispatch:
    inputs:
      opensuse_release:
        description: "openSUSE 版本"
        required: false
        default: "tumbleweed"
        type: choice
        options:
          - tumbleweed
          - leap-15.6

      root_password:
        description: "root 密码"
        required: false
        default: "1234"

      hostname:
        description: "主机名"
        required: false
        default: "opensuse"

      timezone:
        description: "时区"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Tokyo
          - America/New_York
          - Europe/London
          - UTC

env:
  TZ: UTC
  ROOTFS_DIR: /builder/opensuse-rootfs

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile

          sudo -E apt-get -y update
          sudo -E apt-get -y purge \
            azure-cli ghc* zulu* llvm* firefox google* dotnet* \
            powershell openjdk* mongodb* moby* 2>/dev/null || true
          sudo -E apt-get -y install \
            skopeo jq \
            parted e2fsprogs dosfstools btrfs-progs \
            u-boot-tools uuid-runtime openssl pigz \
            git curl wget xz-utils lz4 zstd pv rsync
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ}"

          REL="${{ inputs.opensuse_release || 'tumbleweed' }}"
          echo "OPENSUSE_RELEASE=${REL}" >> "${GITHUB_ENV}"
          echo "ROOT_PASSWORD=${{ inputs.root_password || '1234' }}" >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname || 'opensuse' }}" >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"

          if [[ "${REL}" == "tumbleweed" ]]; then
            echo "OCI_IMAGE=registry.opensuse.org/opensuse/tumbleweed:latest" >> "${GITHUB_ENV}"
            echo "RELEASE_TAG=tumbleweed" >> "${GITHUB_ENV}"
          else
            echo "OCI_IMAGE=registry.opensuse.org/opensuse/leap:15.6" >> "${GITHUB_ENV}"
            echo "RELEASE_TAG=leap156" >> "${GITHUB_ENV}"
          fi
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Create build disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//' ) - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//' ) - 4)
          sudo truncate -s "${mnt_size}G"  /mnt/mnt.img
          sudo truncate -s "${root_size}G" /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6 /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          echo "可用空间: $(df -h /builder | tail -1 | awk '{print $4}')"

      - name: Build openSUSE rootfs
        id: build_rootfs
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail

          sudo mkdir -p "${ROOTFS_DIR}" /tmp/oci-opensuse

          echo "▶ skopeo 拉取 ${OCI_IMAGE} ..."
          sudo skopeo copy "docker://${OCI_IMAGE}" "dir:/tmp/oci-opensuse"

          echo "▶ 解压 OCI layers → ${ROOTFS_DIR} ..."
          if [[ -f /tmp/oci-opensuse/manifest.json ]]; then
            while IFS= read -r dig; do
              [[ -n "$dig" ]] || continue
              dig="${dig#sha256:}"
              f="/tmp/oci-opensuse/${dig}"
              [[ -f "$f" ]] || continue
              echo "  layer ${dig:0:12}..."
              sudo tar -xzf "$f" -C "${ROOTFS_DIR}" 2>/dev/null || \
                sudo tar --zstd -xf "$f" -C "${ROOTFS_DIR}" 2>/dev/null || \
                sudo tar -xJf "$f" -C "${ROOTFS_DIR}" 2>/dev/null || \
                sudo tar -xf "$f" -C "${ROOTFS_DIR}" 2>/dev/null || true
            done < <(jq -r '.layers[]?.digest // empty' /tmp/oci-opensuse/manifest.json 2>/dev/null || true)
          fi
          if [[ ! -d "${ROOTFS_DIR}/etc" ]]; then
            for layer in /tmp/oci-opensuse/*; do
              [[ -f "$layer" ]] || continue
              bn="$(basename "$layer")"
              [[ "$bn" == "manifest.json" || "$bn" == "version" || "$bn" == oci-layout ]] && continue
              sudo tar -xzf "$layer" -C "${ROOTFS_DIR}" 2>/dev/null || \
                sudo tar --zstd -xf "$layer" -C "${ROOTFS_DIR}" 2>/dev/null || \
                sudo tar -xf "$layer" -C "${ROOTFS_DIR}" 2>/dev/null || true
            done
          fi
          [[ -d "${ROOTFS_DIR}/etc" ]] || {
            echo "::error::解压 rootfs 失败，未找到 /etc"
            ls -la /tmp/oci-opensuse
            exit 1
          }
          echo "▶ 底座大小: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"

          mount_chroot() {
            local root="$1"
            sudo mkdir -p "${root}"/{proc,sys,dev,run}
            sudo mount -t proc  proc  "${root}/proc"
            sudo mount -t sysfs sysfs "${root}/sys"
            sudo mount --rbind /dev "${root}/dev"
            sudo mount --make-rslave "${root}/dev"
            sudo mount -t tmpfs tmpfs "${root}/run"
          }
          force_umount() {
            local root="$1"
            if command -v findmnt >/dev/null 2>&1; then
              while read -r tgt; do
                [[ -n "$tgt" ]] || continue
                sudo umount -l "$tgt" 2>/dev/null || true
              done < <(findmnt -R -n -o TARGET --list "$root" 2>/dev/null | sort -r)
            fi
            for sub in run dev sys proc; do
              sudo umount -R -l "${root}/${sub}" 2>/dev/null || true
            done
          }
          trap 'force_umount "${ROOTFS_DIR}"' EXIT

          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee "${ROOTFS_DIR}/etc/resolv.conf" > /dev/null

          mount_chroot "${ROOTFS_DIR}"

          echo "▶ zypper 安装基础包..."
          sudo chroot "${ROOTFS_DIR}" /bin/bash -c '
            set +e
            export ZYPP_CURL2=1
            zypper --non-interactive --gpg-auto-import-keys refresh
            zypper --non-interactive install -y --no-recommends \
              openssh-server sudo curl wget ca-certificates \
              timezone \
              iproute2 NetworkManager \
              net-tools iputils \
              iw wpa_supplicant chrony bc \
              htop nano \
              parted e2fsprogs dosfstools \
              lsof file procps cron rsync
            zypper --non-interactive rm -y -u kernel-default 2>/dev/null
            zypper --non-interactive clean -a
            rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/info/* 2>/dev/null
            find /usr/share/locale -type f ! -name "en_US*" ! -name "zh_CN*" ! -name "zh_TW*" ! -name "locale.alias" -delete 2>/dev/null
            find /usr/share/locale -type d -empty -delete 2>/dev/null
            rm -rf /var/cache/zypp/* /tmp/* /var/tmp/* /root/.cache 2>/dev/null
            exit 0
          '

          sudo chroot "${ROOTFS_DIR}" ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime 2>/dev/null || true
          echo "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hostname" > /dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' \
            "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hosts" > /dev/null

          sudo mkdir -p -m 0755 "${ROOTFS_DIR}/var/run/sshd"
          if [[ -f "${ROOTFS_DIR}/etc/ssh/sshd_config" ]]; then
            sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' "${ROOTFS_DIR}/etc/ssh/sshd_config"
            sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "${ROOTFS_DIR}/etc/ssh/sshd_config"
          fi

          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"

          SYS_CONF="${ROOTFS_DIR}/etc/systemd/system.conf"
          if [[ -f "${SYS_CONF}" ]]; then
            sudo sed -i 's|^#*DefaultTimeoutStartSec.*|DefaultTimeoutStartSec=10s|g' "${SYS_CONF}"
            sudo sed -i 's|^#*DefaultTimeoutStopSec.*|DefaultTimeoutStopSec=10s|g' "${SYS_CONF}"
          fi

          sudo chroot "${ROOTFS_DIR}" bash -c '
            systemctl enable sshd 2>/dev/null || systemctl enable ssh 2>/dev/null || true
            systemctl enable NetworkManager 2>/dev/null || true
            systemctl enable chronyd 2>/dev/null || systemctl enable chrony 2>/dev/null || true
            systemctl disable NetworkManager-wait-online.service 2>/dev/null || true
            systemctl disable systemd-networkd.service 2>/dev/null || true
          '

          if ! grep -q '^VERSION_CODENAME=' "${ROOTFS_DIR}/etc/os-release" 2>/dev/null; then
            echo "VERSION_CODENAME=${RELEASE_TAG}" | sudo tee -a "${ROOTFS_DIR}/etc/os-release" > /dev/null
          fi
          grep -q '^ID=' "${ROOTFS_DIR}/etc/os-release"

          printf 'LABEL=ROOTFS\t/\text4\tdefaults,noatime,nodiratime,commit=600,errors=remount-ro\t0 1\n' \
            | sudo tee "${ROOTFS_DIR}/etc/fstab" > /dev/null
          printf 'LABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n' \
            | sudo tee -a "${ROOTFS_DIR}/etc/fstab" > /dev/null
          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"

          force_umount "${ROOTFS_DIR}"
          trap - EXIT
          sudo rm -rf /tmp/oci-opensuse

          echo "▶ rootfs 最终大小: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Package rootfs
        id: package_rootfs
        if: ${{ steps.build_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"
          TARBALL="openSUSE_${RELEASE_TAG}_rootfs.tar.gz"
          sudo tar -czf "${OUT_DIR}/${TARBALL}" -C "${ROOTFS_DIR}" .
          cd "${OUT_DIR}" && sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "OUT_DIR=${OUT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Package rootfs into an image
        id: wrap_image
        if: ${{ steps.package_rootfs.outputs.status == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/wrap"
          sudo rm -rf "${WORK}" && mkdir -p "${WORK}"
          used_mb=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          img_mb=$(( used_mb * 14 / 10 + 512 ))
          IMG_NAME="openSUSE_${RELEASE_TAG}_arm64_rootfs.img"
          IMG_PATH="${WORK}/${IMG_NAME}"
          truncate -s "${img_mb}M" "${IMG_PATH}"
          parted -s "${IMG_PATH}" mklabel msdos
          parted -s "${IMG_PATH}" mkpart primary ext4 1MiB 100%
          LOOPDEV=$(sudo losetup -P -f --show "${IMG_PATH}")
          sudo mkfs.ext4 -F -L ROOTFS "${LOOPDEV}p1"
          MNT="${WORK}/mnt"
          mkdir -p "${MNT}"
          sudo mount "${LOOPDEV}p1" "${MNT}"
          sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
          grep -q '^ID=' "${MNT}/etc/os-release"
          grep -q '^VERSION_CODENAME=' "${MNT}/etc/os-release" || \
            echo "VERSION_CODENAME=${RELEASE_TAG}" | sudo tee -a "${MNT}/etc/os-release" > /dev/null
          sync
          sudo umount "${MNT}"
          sudo losetup -d "${LOOPDEV}"
          xz -T0 -9 -f "${IMG_PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"
          mv -f "${IMG_PATH}.xz" "${OUT_DIR}/"
          IMG_XZ_NAME="${IMG_NAME}.xz"
          cd "${OUT_DIR}" && sha256sum "${IMG_XZ_NAME}" > "${IMG_XZ_NAME}.sha256"
          echo "IMG_XZ_NAME=${IMG_XZ_NAME}" >> "${GITHUB_OUTPUT}"
          echo "IMG_XZ_PATH=${OUT_DIR}/${IMG_XZ_NAME}" >> "${GITHUB_OUTPUT}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Release rootfs
        uses: ncipollo/release-action@main
        if: ${{ steps.package_rootfs.outputs.status == 'success' && !cancelled() }}
        with:
          tag: rootfs
          name: "rootfs"
          prerelease: true
          artifacts: |
            ${{ steps.wrap_image.outputs.IMG_XZ_PATH }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
