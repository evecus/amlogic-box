name: Build Kernel (Amlogic)

on:
  workflow_dispatch:
    # 手动触发: 不检测, 无条件按 inputs 构建
    inputs:
      version:
        description: "Release version (e.g. 7.2.8)"
        required: true
        default: '7.2.8'
        type: string
      kernel_sign:
        description: '内核版本后缀(可留空)'
        required: false
        default: 'alice'
        type: string
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 北京 2:00

permissions:
  contents: write

env:
  MAJOR: "7.2"   # ★ 定时检测跟踪的大版本号, 改这里即可

jobs:
  check:
    # ★ 只在定时触发时才做检测; 手动触发时整个 job 被 skip
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kernel
          token: ${{ secrets.GITHUB_TOKEN }}   # 允许后面 push 版本文件

      - name: Check latest kernel version
        id: check
        env:
          MAJOR: ${{ env.MAJOR }}
        run: |
          # 1) 取 kernel.org 该大版本下的最新版
          LATEST=$(curl -fsSL https://www.kernel.org/releases.json \
            | jq -r --arg pre "${MAJOR}." \
              '[.releases[].version | select(startswith($pre))]'
            | sort -V | tail -n1)

          if [ -z "$LATEST" ]; then
            echo "!! kernel.org 上没找到 ${MAJOR}.x 的版本"; exit 1
          fi
          echo "kernel.org ${MAJOR}.x 最新: ${LATEST}"

          # 2) 读仓库里已存的版本号 (文件不存在则视为空 = 需要构建)
          SAVED=""
          [ -f LATEST_VERSION ] && SAVED=$(tr -d '[:space:]' < LATEST_VERSION)
          echo "仓库已存版本: ${SAVED:-<无文件, 首次运行>}"

          # 3) 版本比较
          if [ "$(printf '%s\n%s\n' "$SAVED" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ] \
             && [ "$SAVED" != "$LATEST" ]; then
            echo "发现新版本: ${SAVED:-无} -> ${LATEST}, 开始构建"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "无更新, 跳过构建"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

      # ★ 只有定时检测发现新版本才写文件并 push (推回 kernel 分支)
      - name: Commit version file
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.check.outputs.version }}" > LATEST_VERSION
          git add LATEST_VERSION
          git commit -m "chore: update kernel version to ${{ steps.check.outputs.version }}"
          git push

  build:
    needs: check
    # ★ 手动触发: check 为 skipped -> 无条件构建
    # ★ 定时触发: check 通过且 changed=true -> 构建
    if: >-
      always() &&
      (needs.check.result == 'skipped' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-24.04-arm
    env:
      # 手动触发用 inputs.version; 定时触发用 check 检测到的版本
      KVERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || needs.check.outputs.version }}
      KSIGN: ${{ github.event.inputs.kernel_sign || 'alice' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kernel
          fetch-depth: 0

      - name: Download stable kernel source
        run: |
          V="${KVERSION}"
          MAJOR="${V%%.*}"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${V}.tar.xz"
          tar -xf "linux-${V}.tar.xz"
          mv "linux-${V}" linux

      - name: Apply Amlogic vendor u-boot text_offset patch
        working-directory: linux
        run: |
          # ophub/flippy 补丁: Image 头 text_offset=0x1080000
          patch -p1 --batch < ../kernel-config/0001-arm64-image-text_offset-0x1080000-amlogic-vendor-uboot.patch
          grep -n "TEXT_OFFSET 0x01080000" arch/arm64/kernel/image.h
          grep -n "le64sym.*_kernel_offset_le" arch/arm64/kernel/head.S

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            dwarves kmod cpio zstd lz4 udev initramfs-tools u-boot-tools rsync jq

      - name: Configure kernel (defconfig + slim-amlogic + amlogic fragments)
        working-directory: linux
        run: |
          make ARCH=arm64 defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            ../kernel-config/slim.fragment \
            ../kernel-config/save.fragment
          make ARCH=arm64 olddefconfig

      - name: Apply kernel sign (写入 CONFIG_LOCALVERSION, 影响 uname -r)
        working-directory: linux
        run: |
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          if [ -n "${KSIGN}" ]; then
            ./scripts/config --set-str CONFIG_LOCALVERSION "-${KSIGN}"
          else
            ./scripts/config --set-str CONFIG_LOCALVERSION ""
          fi
          make ARCH=arm64 olddefconfig
          echo "kernelrelease = $(make ARCH=arm64 kernelrelease LOCALVERSION=)"

      - name: Embed WiFi/BT firmware into kernel
        working-directory: linux
        run: |
          if [ -d ../kernel-firmware/brcm ] && ls ../kernel-firmware/brcm/* >/dev/null 2>&1; then
            FWLIST=$(cd ../kernel-firmware/brcm && ls | sed 's|^|brcm/|' | tr '\n' ' ')
            ./scripts/config --set-str CONFIG_EXTRA_FIRMWARE "$FWLIST"
            ./scripts/config --set-str CONFIG_EXTRA_FIRMWARE_DIR "$(cd .. && pwd)/kernel-firmware"
            make ARCH=arm64 olddefconfig
            echo "已嵌入固件: $FWLIST"
          else
            echo "!! kernel-firmware/brcm 不存在或为空, 跳过固件内嵌"
          fi

      - name: Build Image
        working-directory: linux
        run: |
          make ARCH=arm64 LOCALVERSION= -j$(nproc) Image

      - name: Verify Image text_offset (must be 0x1080000)
        working-directory: linux
        run: |
          TO=$(python3 -c "import struct;print(hex(struct.unpack('<Q',open('arch/arm64/boot/Image','rb').read(16)[8:16])[0]))")
          echo "Image text_offset = $TO"
          [ "$TO" = "0x1080000" ] || { echo "!! text_offset 补丁未生效"; exit 1; }

      - name: Generate initrd.img / uInitrd (ophub 式)
        run: |
          KVER=$(cd linux && make ARCH=arm64 kernelrelease LOCALVERSION=)

          sudo mkdir -p /boot
          sudo cp linux/System.map "/boot/System.map-${KVER}"
          sudo cp linux/.config "/boot/config-${KVER}"
          sudo cp linux/arch/arm64/boot/Image "/boot/vmlinuz-${KVER}"
          sudo cp linux/arch/arm64/boot/Image "/boot/Image"

          sudo sed -i "s|^COMPRESS=.*|COMPRESS=gzip|g" /etc/initramfs-tools/initramfs.conf
          sudo mkdir -p /etc/initramfs/post-update.d
          sudo tee /etc/initramfs/post-update.d/99-uboot > /dev/null << 'EOF'
          #!/bin/sh
          K_VER="$1"
          [ -f "/boot/initrd.img-${K_VER}" ] || exit 0
          mkimage -A arm64 -O linux -T ramdisk -C gzip -n uInitrd \
            -d "/boot/initrd.img-${K_VER}" "/boot/uInitrd-${K_VER}"
          EOF
          sudo chmod +x /etc/initramfs/post-update.d/99-uboot
          sudo rm -f /etc/initramfs/post-update.d/flash-kernel

          sudo update-initramfs -c -k "${KVER}"
          ls -l "/boot/initrd.img-${KVER}" "/boot/uInitrd-${KVER}"
          [[ -f "/boot/uInitrd-${KVER}" ]] || { echo "uInitrd 生成失败"; exit 1; }

          mkdir -p boot-extra
          cp "/boot/initrd.img-${KVER}" boot-extra/
          cp "/boot/uInitrd-${KVER}" boot-extra/

      - name: Package (tar.gz + deb)
        run: |
          KVER=$(cd linux && make ARCH=arm64 kernelrelease LOCALVERSION=)
          PKG="amlogic-kernel-${KVER}"

          # --- tar.gz: ophub 布局 ---
          mkdir -p "${PKG}"
          cp linux/arch/arm64/boot/Image "${PKG}/"
          cp boot-extra/initrd.img-${KVER} "${PKG}/initrd.img" 2>/dev/null || true
          cp boot-extra/uInitrd-${KVER} "${PKG}/uInitrd" 2>/dev/null || true
          cp linux/.config "${PKG}/kernel-config"
          tar -czf "${PKG}.tar.gz" "${PKG}"

          # --- deb 包: 文件装到 /usr/lib, postinst cp 到 /boot (vfat 兼容) ---
          DEB="linux-image-amlogic"
          LIBDIR="usr/lib/linux-image-${KVER}"
          mkdir -p "${DEB}/DEBIAN" \
            "${DEB}/${LIBDIR}" \
            "${DEB}/usr/share/doc/${DEB}"
          cp linux/arch/arm64/boot/Image "${DEB}/${LIBDIR}/zImage"
          cp linux/.config "${DEB}/${LIBDIR}/kernel-config"
          cp boot-extra/uInitrd-${KVER} "${DEB}/${LIBDIR}/uInitrd" 2>/dev/null || true
          [[ -f "${DEB}/${LIBDIR}/uInitrd" ]] || { echo "!! deb 缺少 uInitrd"; exit 1; }

          cat > "${DEB}/DEBIAN/control" << EOF
          Package: linux-image-amlogic
          Version: ${KVER}
          Architecture: arm64
          Maintainer: evecus <evecus@users.noreply.github.com>
          Depends:
          Provides: linux-image
          Section: kernel
          Priority: optional
          Description: Amlogic TV boxes kernel ${KVER} (mainline ${KVER%%-*}, all-builtin, wired-first, HDMI enabled)

          Boards: Phicomm-N1 (S905D), CM311-1a-YST (S905L3A), M302A (S905L3B) and same-family boxes
          EOF

          cat > "${DEB}/DEBIAN/postinst" << EOF
          #!/bin/sh
          set -e
          LIBDIR="/usr/lib/linux-image-${KVER}"
          if [ -f "\${LIBDIR}/zImage" ] && [ -f "\${LIBDIR}/uInitrd" ] && [ -d /boot ]; then
            cp -f "\${LIBDIR}/zImage" /boot/zImage
            cp -f "\${LIBDIR}/kernel-config" /boot/kernel-config
            cp -f "\${LIBDIR}/uInitrd" /boot/uInitrd
            sync
          fi
          exit 0
          EOF
          chmod 755 "${DEB}/DEBIAN/postinst"
          dpkg-deb --root-owner-group --build "${DEB}" "${PKG}.deb"

          echo "PKG_TAR=${PKG}.tar.gz" >> $GITHUB_ENV
          echo "PKG_DEB=${PKG}.deb" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel
          files: |
            ${{ env.PKG_TAR }}
            ${{ env.PKG_DEB }}
