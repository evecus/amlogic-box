name: Build Kernel nodisplay

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 7.2.8)"
        required: true
        default: '7.2.8'
        type: string
      kernel_sign:
        description: '内核版本后缀(可留空)'
        required: false
        default: 'alice'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      KVERSION: ${{ github.event.inputs.version }}
      KSIGN: ${{ github.event.inputs.kernel_sign || 'alice' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kernel
          fetch-depth: 0

      - name: Download stable kernel source
        run: |
          V="${KVERSION}"
          MAJOR="${V%%.*}"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${V}.tar.xz"
          tar -xf "linux-${V}.tar.xz"
          mv "linux-${V}" linux

      - name: Apply Amlogic vendor u-boot text_offset patch
        working-directory: linux
        run: |
          # ophub/flippy 补丁: Image 头 text_offset=0x1080000
          patch -p1 --batch < ../kernel-config/0x1080000.patch
          grep -n "TEXT_OFFSET 0x01080000" arch/arm64/kernel/image.h
          grep -n "le64sym.*_kernel_offset_le" arch/arm64/kernel/head.S

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            dwarves kmod cpio zstd lz4 udev initramfs-tools u-boot-tools rsync jq

      - name: Configure kernel (defconfig + slim-amlogic + amlogic fragments)
        working-directory: linux
        run: |
          make ARCH=arm64 defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            ../kernel-config/slim.fragment \
            ../kernel-config/slimx.fragment \
            ../kernel-config/save.fragment \
            ../kernel-config/silm-display.fragment
          make ARCH=arm64 olddefconfig

      - name: Apply kernel sign (写入 CONFIG_LOCALVERSION, 影响 uname -r)
        working-directory: linux
        run: |
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          if [ -n "${KSIGN}" ]; then
            ./scripts/config --set-str CONFIG_LOCALVERSION "-${KSIGN}"
          else
            ./scripts/config --set-str CONFIG_LOCALVERSION ""
          fi
          make ARCH=arm64 olddefconfig
          echo "kernelrelease = $(make ARCH=arm64 kernelrelease LOCALVERSION=)"

      - name: Build Image
        working-directory: linux
        run: |
          make ARCH=arm64 LOCALVERSION= -j$(nproc) Image

      - name: Verify Image text_offset (must be 0x1080000)
        working-directory: linux
        run: |
          TO=$(python3 -c "import struct;print(hex(struct.unpack('<Q',open('arch/arm64/boot/Image','rb').read(16)[8:16])[0]))")
          echo "Image text_offset = $TO"
          [ "$TO" = "0x1080000" ] || { echo "!! text_offset 补丁未生效"; exit 1; }

      - name: Generate initrd.img / uInitrd (ophub 式)
        run: |
          KVER=$(cd linux && make ARCH=arm64 kernelrelease LOCALVERSION=)

          sudo mkdir -p /boot
          sudo cp linux/System.map "/boot/System.map-${KVER}"
          sudo cp linux/.config "/boot/config-${KVER}"
          sudo cp linux/arch/arm64/boot/Image "/boot/vmlinuz-${KVER}"
          sudo cp linux/arch/arm64/boot/Image "/boot/Image"

          sudo sed -i "s|^COMPRESS=.*|COMPRESS=gzip|g" /etc/initramfs-tools/initramfs.conf
          sudo mkdir -p /etc/initramfs/post-update.d
          sudo tee /etc/initramfs/post-update.d/99-uboot > /dev/null << 'UBOOT'
          #!/bin/sh
          K_VER="$1"
          [ -f "/boot/initrd.img-${K_VER}" ] || exit 0
          mkimage -A arm64 -O linux -T ramdisk -C gzip -n uInitrd \
            -d "/boot/initrd.img-${K_VER}" "/boot/uInitrd-${K_VER}"
          UBOOT
          sudo chmod +x /etc/initramfs/post-update.d/99-uboot
          sudo rm -f /etc/initramfs/post-update.d/flash-kernel

          sudo update-initramfs -c -k "${KVER}"
          ls -l "/boot/initrd.img-${KVER}" "/boot/uInitrd-${KVER}"
          [[ -f "/boot/uInitrd-${KVER}" ]] || { echo "uInitrd 生成失败"; exit 1; }

          mkdir -p boot-extra
          cp "/boot/initrd.img-${KVER}" boot-extra/
          cp "/boot/uInitrd-${KVER}" boot-extra/

      - name: Package (tar.gz + deb)
        run: |
          set -euo pipefail
          KVER=$(cd linux && make ARCH=arm64 kernelrelease LOCALVERSION=)
          PKG="amlogic-kernel-${KVER}-nodisplay"

          # --- tar.gz: ophub 布局 ---
          mkdir -p "${PKG}"
          cp linux/arch/arm64/boot/Image "${PKG}/"
          cp "boot-extra/initrd.img-${KVER}" "${PKG}/initrd.img" 2>/dev/null || true
          cp "boot-extra/uInitrd-${KVER}" "${PKG}/uInitrd" 2>/dev/null || true
          cp linux/.config "${PKG}/kernel-config"
          tar -czf "${PKG}.tar.gz" "${PKG}"

          # --- deb 包: 文件装到 /usr/lib, postinst cp 到 /boot (vfat 兼容) ---
          DEB="linux-image-amlogic"
          LIBDIR="usr/lib/linux-image-${KVER}"
          rm -rf "${DEB}"
          mkdir -p "${DEB}/DEBIAN" \
            "${DEB}/${LIBDIR}" \
            "${DEB}/usr/share/doc/${DEB}"
          cp linux/arch/arm64/boot/Image "${DEB}/${LIBDIR}/zImage"
          cp linux/.config "${DEB}/${LIBDIR}/kernel-config"
          cp "boot-extra/uInitrd-${KVER}" "${DEB}/${LIBDIR}/uInitrd" 2>/dev/null || true
          [[ -f "${DEB}/${LIBDIR}/uInitrd" ]] || { echo "!! deb 缺少 uInitrd"; exit 1; }

          # deb control: Description 续行必须以空格开头；空 Depends 字段省略
          {
            echo "Package: linux-image-amlogic"
            echo "Version: ${KVER}"
            echo "Architecture: arm64"
            echo "Maintainer: evecus <evecus@users.noreply.github.com>"
            echo "Provides: linux-image"
            echo "Section: kernel"
            echo "Priority: optional"
            echo "Description: Amlogic TV boxes kernel ${KVER} (mainline, all-builtin, HDMI)"
            echo " Boards: Phicomm-N1 (S905D), CM311-1a-YST (S905L3A), M302A (S905L3B)"
          } > "${DEB}/DEBIAN/control"

          cat > "${DEB}/DEBIAN/postinst" << EOF
          #!/bin/sh
          set -e
          LIBDIR="/usr/lib/linux-image-${KVER}"
          if [ -f "\${LIBDIR}/zImage" ] && [ -f "\${LIBDIR}/uInitrd" ] && [ -d /boot ]; then
            cp -f "\${LIBDIR}/zImage" /boot/zImage
            cp -f "\${LIBDIR}/kernel-config" /boot/kernel-config
            cp -f "\${LIBDIR}/uInitrd" /boot/uInitrd
            sync
          fi
          exit 0
          EOF
          # 去掉 heredoc 因 YAML 缩进带来的前导空格
          sed -i 's/^[[:space:]]*//' "${DEB}/DEBIAN/postinst"
          chmod 755 "${DEB}/DEBIAN/postinst"
          dpkg-deb --root-owner-group --build "${DEB}" "${PKG}.deb"

          echo "PKG_TAR=${PKG}.tar.gz" >> $GITHUB_ENV
          echo "PKG_DEB=${PKG}.deb" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel
          files: |
            ${{ env.PKG_TAR }}
            ${{ env.PKG_DEB }}
