# amlogic-rebuild 板级配置
# 字段: BOARD_NAME : MODEL_ID : MODEL_NAME : SOC : FAMILY : FDTFILE : UBOOT_OVERLOAD : BOOTLOADER_IMG : EXTRA_APPEND
# 说明:
#   MODEL_ID        沿用 ophub model_database.conf 的 ID (install-emmc 依据它走分区空隙分支)
#   UBOOT_OVERLOAD  ophub 预编译 mainline u-boot, 以原名拷入 bootfs (install-emmc 选型检查/装 eMMC 用;
#                   内核已打 TEXT_OFFSET 补丁, USB 启动不需要 u-boot.ext 链载, 对齐 ophub 官方镜像)
#   BOOTLOADER_IMG  写入镜像 0 扇区的安卓 bootloader (.sd.bin), NA = 不写 (USB 由板上原厂 uboot 直接引导)
#   EXTRA_APPEND    追加到 uEnv.txt APPEND 的板级内核参数 (来自 ophub different-files 各板 uEnv.txt)
#   u-boot/*.bin    与 UBOOT_OVERLOAD / BOOTLOADER_IMG 同名
phicomm-n1:   101 : Phicomm-N1    : s905d   : meson-gxl : meson-gxl-s905d-phicomm-n1.dtb : u-boot-n1.bin          : u-boot-2015-phicomm-n1.bin :
cm311-1a-yst: 305 : CM311-1a-YST  : s905l3a : meson-g12a : meson-g12a-s905l3a-cm311.dtb : u-boot-e900v22c.bin    : NA :
m302a:        127 : M302A         : s905l3b : meson-gxl : meson-gxl-s905l3b-m302a.dtb   : u-boot-s905x-s912.bin  : NA :
wxy-oes:      409 : WXY-OES       : a311d   : meson-g12b : meson-g12b-a311d-oes-a.dtb  : u-boot-s905x2-s922.bin : NA : coherent_pool=2M libata.force=noncq usb-storage.quirks=0x2537:0x1066:u,0x2537:0x1068:u
